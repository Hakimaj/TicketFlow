# Local PostgreSQL for TicketFlow backend development only.
#
# Usage (from backend/):
#   cp .env.example .env      # local, non-production values
#   docker compose up -d db
#   docker compose ps         # wait for "healthy"
#
# Credentials are read from the environment / backend/.env; nothing secret is
# committed. The named volume keeps data across restarts. No other services
# are added here.

name: ticketflow

services:
  db:
    image: postgres:16-alpine
    container_name: ticketflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Deterministic collation keeps ordering stable across machines.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ticketflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  ticketflow_pgdata:
