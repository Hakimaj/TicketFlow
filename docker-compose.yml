# TicketFlow full stack: PostgreSQL + FastAPI API + nginx-served web client.
#
# This is a self-contained evaluation/staging-shaped stack. It is deliberately
# separate from backend/docker-compose.yml, which only runs the PostgreSQL
# service used by local (non-containerised) backend development: the two use
# different project names, volumes and container names, so neither can touch
# the other's data.
#
#   cp .env.example .env      # then edit JWT_SECRET and POSTGRES_PASSWORD
#   docker compose up -d --build
#   docker compose exec api python -m scripts.seed          # demo dataset (optional)
#   docker compose exec \
#     -e BOOTSTRAP_ADMIN_EMAIL=you@example.com \
#     -e BOOTSTRAP_ADMIN_PASSWORD='a-strong-password' \
#     api python -m scripts.bootstrap                       # first account
#   open http://localhost:8080
#
# Nothing secret is stored in this file: every credential comes from the
# environment (see .env.example). APP_ENV=production additionally requires
# COOKIE_SECURE=true and https:// origins, enforced at API startup.

name: ticketflow-app

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - ticketflow-app-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (at least 32 characters)}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-300}
      DEMO_ACCOUNTS_ENABLED: ${DEMO_ACCOUNTS_ENABLED:-false}
    # Migrations are applied before the API accepts traffic; re-running is a
    # no-op, so a restart never leaves the schema behind the code.
    command:
      - sh
      - -c
      - >-
        python -m alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
        --proxy-headers --forwarded-allow-ips=*
    # The API has no published port; only nginx on the private Compose network
    # can reach it, and nginx overwrites X-Forwarded-For before proxying.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8080}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1/healthz >/dev/null']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  # Named explicitly so this stack can never mount the development database
  # volume created by backend/docker-compose.yml.
  ticketflow-app-pgdata:
    name: ticketflow-app-pgdata
